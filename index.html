<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>비나메이트 마스터 모바일</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; padding: 10px; background-color: #f0f0f0; display: flex; flex-direction: column; align-items: center; }
        h2 { margin: 10px 0; font-size: 20px; text-align: center; }
        #status { font-weight: bold; margin-bottom: 5px; color: #333; font-size: 18px; }
        #move-counter { font-size: 14px; margin-bottom: 5px; color: #555; font-weight: bold; transition: color 0.3s; }
        #feedback { font-size: 14px; margin-bottom: 15px; color: blue; text-align: center; min-height: 20px; font-weight: bold; }
        
        #board-container { position: relative; width: 100%; max-width: 500px; aspect-ratio: 1 / 1; border: 2px solid #333; }
        #board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; }
        
        .square { display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        .light { background-color: #EEEED2; }
        .dark { background-color: #769656; }
        .highlight { background-color: #F6F669 !important; }
        
        .dot { width: 30%; height: 30%; background-color: rgba(0, 0, 0, 0.25); border-radius: 50%; pointer-events: none; }
        .piece { width: 90%; height: 90%; background-size: cover; background-position: center; pointer-events: none; }
        
        #svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #controls, #replay-controls { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 500px;}
        .mode-select { display: flex; gap: 15px; font-size: 14px; }
        
        /* 기본 버튼 그룹 (연습, 시범 버튼 등) */
        .btn-group { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; justify-content: center;}
        
        /* 복기 네비게이션 전용 그룹 (새로 추가됨) */
        .nav-group { display: flex; gap: 5px; width: 100%; flex-wrap: nowrap; justify-content: space-between; }
        
        /* 공통 버튼 스타일 */
        button { padding: 10px 5px; font-size: 14px; font-weight: bold; color: white; border: none; border-radius: 8px; flex: 1; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-width: 30%; }
        button:active { transform: translateY(2px); }
        
        .btn-new { background-color: #4CAF50; }
        .btn-new:active { background-color: #45a049; }
        .btn-new-center { background-color: #2980b9; }
        .btn-new-center:active { background-color: #2471a3; }
        .btn-demo { background-color: #8e44ad; }
        .btn-demo:active { background-color: #732d91; }
        
        /* 네비게이션 버튼 전용 스타일 */
        .btn-nav { background-color: #34495e; font-size: 18px; padding: 10px; min-width: 0; } /* min-width를 0으로 하여 한 줄에 맞게 조절 */
        .btn-nav:active { background-color: #2c3e50; }
        
        .btn-exit { background-color: #e74c3c; margin-top: 5px; width: 100%; min-width: 100%;}
        .btn-exit:active { background-color: #c0392b; }
    </style>
</head>
<body>

    <h2>비나메이트 마스터 (오답 튜터 모드)</h2>
    <div id="status">로딩 중...</div>
    <div id="move-counter">현재 1수 진행 중 (무승부까지: 50수 남음)</div>
    <div id="feedback">체스 엔진을 준비하고 있습니다.</div>

    <div id="board-container">
        <div id="board"></div>
        <svg id="svg-layer" viewBox="0 0 8 8">
            <defs>
                <marker id="arrowhead" markerWidth="3" markerHeight="3" refX="1.5" refY="1.5" orient="auto">
                    <polygon points="0 0, 3 1.5, 0 3" fill="#e74c3c" />
                </marker>
            </defs>
            <line id="tutor-arrow" x1="0" y1="0" x2="0" y2="0" stroke="#e74c3c" stroke-width="0.15" marker-end="url(#arrowhead)" display="none" />
        </svg>
    </div>

    <!-- 기본 컨트롤 영역 -->
    <div id="controls">
        <div class="mode-select">
            <label><input type="radio" name="mode" value="random"> 랜덤 (쉬움)</label>
            <label><input type="radio" name="mode" value="engine" checked> 엔진 (어려움)</label>
        </div>
        <div class="btn-group">
            <button class="btn-new" onclick="newGame('random')">무작위 새 연습</button>
            <button class="btn-new-center" onclick="newGame('center')">중앙 새 연습</button>
            <button class="btn-demo" onclick="runAIDemo()">AI 시범 보기</button>
        </div>
    </div>

    <!-- 복기 컨트롤 영역 -->
    <div id="replay-controls" style="display: none;">
        <!-- btn-group 대신 nav-group 사용 -->
        <div class="nav-group">
            <button class="btn-nav" onclick="navDemo('first')">≪</button>
            <button class="btn-nav" onclick="navDemo('prev')">＜</button>
            <button class="btn-nav" onclick="navDemo('next')">＞</button>
            <button class="btn-nav" onclick="navDemo('last')">≫</button>
        </div>
        <button class="btn-exit" onclick="exitDemo()">시범 종료 및 돌아가기</button>
    </div>

    <script>
        const game = new Chess();
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        let selectedSquare = null;
        let isCalculating = false;
        let isDemoMode = false;
        let missedBestMove = null;

        let savedFenBeforeDemo = "";
        let demoHistory = [];
        let currentDemoIndex = 0;

        const pieceUrls = {
            'K': 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wk.png',
            'B': 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wb.png',
            'N': 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wn.png',
            'k': 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bk.png'
        };

        const moveSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-self.mp3');
        const captureSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/capture.mp3');

        function playSound(moveObj) {
            if (!moveObj) return;
            if (moveObj.captured) {
                captureSound.currentTime = 0;
                captureSound.play().catch(e => {});
            } else {
                moveSound.currentTime = 0;
                moveSound.play().catch(e => {});
            }
        }

        const workerCode = `importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.0/stockfish.js');`;
        const blob = new Blob([workerCode], {type: 'application/javascript'});
        const engine = new Worker(URL.createObjectURL(blob));

        engine.onmessage = function(event) {
            if (event.data === "uciok") newGame('random');
        };
        engine.postMessage("uci");

        function getBestMove(fen, timeLimit = 1500) {
            return new Promise(resolve => {
                const listener = function(event) {
                    const msg = event.data;
                    if (msg.startsWith("bestmove")) {
                        engine.removeEventListener('message', listener);
                        resolve(msg.split(" ")[1]); 
                    }
                };
                engine.addEventListener('message', listener);
                engine.postMessage(`position fen ${fen}`);
                engine.postMessage(`go movetime ${timeLimit}`);
            });
        }

        function assembleFen(wk, wb, wn, bk) {
            let board = Array.from({ length: 8 }, () => Array(8).fill(null));
            board[wk.r][wk.c] = 'K';
            board[wb.r][wb.c] = 'B';
            board[wn.r][wn.c] = 'N';
            board[bk.r][bk.c] = 'k';

            let fen = "";
            for (let r = 0; r < 8; r++) {
                let emptyCount = 0;
                for (let c = 0; c < 8; c++) {
                    if (board[r][c] === null) emptyCount++;
                    else {
                        if (emptyCount > 0) fen += emptyCount;
                        fen += board[r][c];
                        emptyCount = 0;
                    }
                }
                if (emptyCount > 0) fen += emptyCount;
                if (r < 7) fen += "/";
            }
            return fen + " w - - 0 1";
        }

        function generateRandomValidFEN_Anywhere() {
            while (true) {
                let squares = [];
                while (squares.length < 3) {
                    let randomSq = Math.floor(Math.random() * 64);
                    if (!squares.includes(randomSq)) squares.push(randomSq);
                }
                const wk = { r: Math.floor(squares[0] / 8), c: squares[0] % 8 };
                const wb = { r: Math.floor(squares[1] / 8), c: squares[1] % 8 };
                const wn = { r: Math.floor(squares[2] / 8), c: squares[2] % 8 };

                let safeSquares = [];
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if ((r === wk.r && c === wk.c) || (r === wb.r && c === wb.c) || (r === wn.r && c === wn.c)) continue;

                        let isSafe = true;
                        if (Math.abs(wk.r - r) <= 1 && Math.abs(wk.c - c) <= 1) isSafe = false;

                        if (isSafe) {
                            let ndx = Math.abs(wn.r - r), ndy = Math.abs(wn.c - c);
                            if ((ndx === 1 && ndy === 2) || (ndx === 2 && ndy === 1)) isSafe = false;
                        }

                        if (isSafe) {
                            let bdx = Math.abs(wb.r - r), bdy = Math.abs(wb.c - c);
                            if (bdx === bdy) {
                                let isBlocked = false;
                                let stepR = r > wb.r ? 1 : -1, stepC = c > wb.c ? 1 : -1;
                                let currR = wb.r + stepR, currC = wb.c + stepC;
                                while (currR !== r && currC !== c) {
                                    if ((currR === wk.r && currC === wk.c) || (currR === wn.r && currC === wn.c)) {
                                        isBlocked = true; break;
                                    }
                                    currR += stepR; currC += stepC;
                                }
                                if (!isBlocked) isSafe = false;
                            }
                        }
                        if (isSafe) safeSquares.push({r: r, c: c});
                    }
                }

                if (safeSquares.length > 0) {
                    const randomSafeIdx = Math.floor(Math.random() * safeSquares.length);
                    const bk = safeSquares[randomSafeIdx];
                    return assembleFen(wk, wb, wn, bk);
                }
            }
        }

        function generateRandomValidFEN_Center() {
            const centerSquares = [
                {r: 3, c: 3}, {r: 3, c: 4},
                {r: 4, c: 3}, {r: 4, c: 4}
            ];

            const wbIdx = Math.floor(Math.random() * 4);
            const wb = centerSquares[wbIdx];
            const emptySq = {r: 7 - wb.r, c: 7 - wb.c};

            const remaining = centerSquares.filter(sq => 
                !(sq.r === wb.r && sq.c === wb.c) && 
                !(sq.r === emptySq.r && sq.c === emptySq.c)
            );

            const isSwap = Math.random() < 0.5;
            const wk = isSwap ? remaining[0] : remaining[1];
            const wn = isSwap ? remaining[1] : remaining[0];

            let safeSquares = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r === wk.r && c === wk.c) || (r === wb.r && c === wb.c) || (r === wn.r && c === wn.c)) continue;
                    let isSafe = true;
                    if (Math.abs(wk.r - r) <= 1 && Math.abs(wk.c - c) <= 1) isSafe = false;
                    if (isSafe) {
                        let ndx = Math.abs(wn.r - r), ndy = Math.abs(wn.c - c);
                        if ((ndx === 1 && ndy === 2) || (ndx === 2 && ndy === 1)) isSafe = false;
                    }
                    if (isSafe) {
                        let bdx = Math.abs(wb.r - r), bdy = Math.abs(wb.c - c);
                        if (bdx === bdy) {
                            let isBlocked = false;
                            let stepR = r > wb.r ? 1 : -1, stepC = c > wb.c ? 1 : -1;
                            let currR = wb.r + stepR, currC = wb.c + stepC;
                            while (currR !== r && currC !== c) {
                                if ((currR === wk.r && currC === wk.c) || (currR === wn.r && currC === wn.c)) {
                                    isBlocked = true; break;
                                }
                                currR += stepR; currC += stepC;
                            }
                            if (!isBlocked) isSafe = false;
                        }
                    }
                    if (isSafe) safeSquares.push({r: r, c: c});
                }
            }
            const bk = safeSquares[Math.floor(Math.random() * safeSquares.length)];
            return assembleFen(wk, wb, wn, bk);
        }

        function renderBoard() {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = ''; 
            const boardState = game.board(); 
            const legalMoves = game.moves({ verbose: true });

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareId = files[c] + (8 - r);
                    const squareDiv = document.createElement('div');
                    squareDiv.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    squareDiv.dataset.square = squareId;
                    squareDiv.onclick = () => handleSquareClick(squareId);

                    if (selectedSquare === squareId) squareDiv.classList.add('highlight');

                    const piece = boardState[r][c];
                    if (piece) {
                        const pieceSymbol = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                        if (pieceUrls[pieceSymbol]) {
                            const img = document.createElement('div');
                            img.className = 'piece';
                            img.style.backgroundImage = `url(${pieceUrls[pieceSymbol]})`;
                            squareDiv.appendChild(img);
                        }
                    }

                    if (selectedSquare && legalMoves.some(m => m.from === selectedSquare && m.to === squareId) && !isDemoMode && document.getElementById('replay-controls').style.display === 'none') {
                        const dot = document.createElement('div');
                        dot.className = 'dot';
                        squareDiv.appendChild(dot);
                    }
                    boardDiv.appendChild(squareDiv);
                }
            }
            drawArrow();
        }

        function drawArrow() {
            const arrow = document.getElementById('tutor-arrow');
            if (missedBestMove && !isDemoMode && document.getElementById('replay-controls').style.display === 'none') {
                const fromFile = files.indexOf(missedBestMove.charAt(0));
                const fromRank = 8 - parseInt(missedBestMove.charAt(1));
                const toFile = files.indexOf(missedBestMove.charAt(2));
                const toRank = 8 - parseInt(missedBestMove.charAt(3));

                arrow.setAttribute('x1', fromFile + 0.5);
                arrow.setAttribute('y1', fromRank + 0.5);
                arrow.setAttribute('x2', toFile + 0.5);
                arrow.setAttribute('y2', toRank + 0.5);
                arrow.style.display = 'block';
            } else {
                arrow.style.display = 'none';
            }
        }

        function updateStatus() {
            const statusEl = document.getElementById('status');
            const feedbackEl = document.getElementById('feedback');
            const counterEl = document.getElementById('move-counter');

            const fenParts = game.fen().split(' ');
            const halfMoves = parseInt(fenParts[4], 10);
            const fullMoves = parseInt(fenParts[5], 10); 
            const movesLeft = 50 - Math.floor(halfMoves / 2);

            if (movesLeft <= 10) counterEl.style.color = "#e74c3c";
            else counterEl.style.color = "#555";
            
            counterEl.innerText = `현재 ${fullMoves}수 진행 중 (무승부까지: ${movesLeft}수 남음)`;

            if (game.in_checkmate()) {
                statusEl.innerText = "🎉 승리! 체크메이트 🎉";
                feedbackEl.innerText = isDemoMode ? "AI가 체크메이트를 달성했습니다!" : "완벽한 마무리입니다!";
                feedbackEl.style.color = "green";
                counterEl.innerText = `총 ${fullMoves}수 만에 체크메이트 성공!`;
                counterEl.style.color = "#2980b9";
            } else if (game.in_draw() || halfMoves >= 100) {
                statusEl.innerText = "무승부! (50수 초과 / 스테일메이트)";
                counterEl.innerText = "50수 제한에 도달하여 무승부 처리되었습니다.";
                counterEl.style.color = "#e74c3c";
            } else if (!isCalculating && !isDemoMode) {
                statusEl.innerText = game.turn() === 'w' ? "현재 턴: 백(당신)" : "현재 턴: 흑(컴퓨터)";
            } else if (isDemoMode && document.getElementById('replay-controls').style.display === 'block') {
                statusEl.innerText = "AI 기보 복기 중";
            }
        }

        function stopDemoAndReset() {
            isDemoMode = false;
            document.getElementById('replay-controls').style.display = 'none';
            document.getElementById('controls').style.display = 'flex';
            document.querySelector('.btn-new').disabled = false;
            document.querySelector('.btn-new-center').disabled = false;
            document.querySelector('.btn-demo').disabled = false;
        }

        function newGame(type) {
            stopDemoAndReset();

            const fen = type === 'center' ? generateRandomValidFEN_Center() : generateRandomValidFEN_Anywhere();
            game.load(fen);
            
            selectedSquare = null;
            missedBestMove = null;
            isCalculating = false;
            
            const message = type === 'center' ? "정중앙 배치 완료! 비숍 길이 열려있습니다." : "완전 무작위 배치 완료! 첫 수를 둬보세요.";
            document.getElementById('feedback').innerText = message;
            document.getElementById('feedback').style.color = "blue";
            
            renderBoard();
            updateStatus();
        }

        async function handleSquareClick(square) {
            if (game.game_over() || game.turn() === 'b' || isCalculating || isDemoMode || document.getElementById('replay-controls').style.display === 'block') return;

            const piece = game.get(square);

            if (selectedSquare === null) {
                if (piece && piece.color === 'w') {
                    selectedSquare = square;
                    missedBestMove = null;
                    renderBoard();
                }
                return;
            }

            const moves = game.moves({ verbose: true });
            const move = moves.find(m => m.from === selectedSquare && m.to === square);

            if (move) {
                isCalculating = true;
                selectedSquare = null;
                
                const previousFen = game.fen();
                
                const moveObj = game.move(move.san);
                playSound(moveObj);
                renderBoard();
                
                document.getElementById('status').innerText = "당신의 수를 평가 중... (1.5초)";

                const bestMoveEngine = await getBestMove(previousFen, 1500); 
                const playerMoveEngineFormat = move.from + move.to;
                
                if (playerMoveEngineFormat === bestMoveEngine) {
                    document.getElementById('feedback').innerText = `정확한 수입니다! (${move.san})`;
                    document.getElementById('feedback').style.color = "green";
                    missedBestMove = null;
                } else {
                    const tempGame = new Chess(previousFen);
                    const correctMove = tempGame.move(bestMoveEngine, { sloppy: true });
                    document.getElementById('feedback').innerText = `아쉬운 수입니다 (${move.san}). 원래 뒀어야 할 수: ${correctMove.san}`;
                    document.getElementById('feedback').style.color = "#e74c3c";
                    missedBestMove = bestMoveEngine;
                }

                renderBoard();
                updateStatus();
                setTimeout(makeComputerMove, 100);

            } else {
                if (piece && piece.color === 'w') {
                    selectedSquare = square;
                    missedBestMove = null;
                } else {
                    selectedSquare = null;
                }
                renderBoard();
            }
        }

        async function makeComputerMove() {
            if (game.game_over() || game.turn() !== 'b' || isDemoMode) return;

            const mode = document.querySelector('input[name="mode"]:checked').value;
            let moveObj = null;

            if (mode === 'engine') {
                document.getElementById('status').innerText = "컴퓨터가 방어 중... (1.5초)";
                const bestMove = await getBestMove(game.fen(), 1500);
                moveObj = game.move(bestMove, { sloppy: true });
            } else {
                const moves = game.moves();
                const randomMove = moves[Math.floor(Math.random() * moves.length)];
                moveObj = game.move(randomMove);
            }
            
            playSound(moveObj);

            isCalculating = false;
            renderBoard();
            updateStatus();
        }

        async function runAIDemo() {
            if (isCalculating || isDemoMode || game.game_over()) return;
            
            isDemoMode = true;
            selectedSquare = null;
            missedBestMove = null;
            
            savedFenBeforeDemo = game.fen();
            
            demoHistory = [];
            demoHistory.push(game.fen());
            
            document.getElementById('feedback').innerText = "AI가 체크메이트 시범을 보여줍니다!";
            document.getElementById('feedback').style.color = "#8e44ad";
            
            renderBoard();

            while (isDemoMode && !game.game_over()) {
                const turnStr = game.turn() === 'w' ? '백' : '흑';
                document.getElementById('status').innerText = `AI 시범 진행 중... (${turnStr} 턴)`;
                
                const bestMove = await getBestMove(game.fen(), 300);
                
                if (!isDemoMode) return;

                const moveObj = game.move(bestMove, { sloppy: true });
                playSound(moveObj);
                
                demoHistory.push(game.fen());
                
                renderBoard();
                updateStatus(); 
                
                await new Promise(resolve => setTimeout(resolve, 400));
                
                if (!isDemoMode) return;
            }

            if (isDemoMode && (game.in_checkmate() || game.in_draw())) {
                document.getElementById('controls').style.display = 'none';
                document.getElementById('replay-controls').style.display = 'flex';
                
                document.getElementById('feedback').innerText = "시범이 종료되었습니다. 아래 버튼으로 기보를 복기해보세요.";
                document.getElementById('feedback').style.color = "#e67e22";
                
                currentDemoIndex = demoHistory.length - 1;
            }
        }

        function navDemo(action) {
            let previousIndex = currentDemoIndex;

            if (action === 'first') currentDemoIndex = 0;
            else if (action === 'prev' && currentDemoIndex > 0) currentDemoIndex--;
            else if (action === 'next' && currentDemoIndex < demoHistory.length - 1) currentDemoIndex++;
            else if (action === 'last') currentDemoIndex = demoHistory.length - 1;

            if (previousIndex !== currentDemoIndex) {
                moveSound.currentTime = 0;
                moveSound.play().catch(e => {});
            }

            game.load(demoHistory[currentDemoIndex]);
            renderBoard();
            updateStatus();
            
            document.getElementById('feedback').innerText = `기보 탐색 중: ${currentDemoIndex} / ${demoHistory.length - 1} 수`;
        }

        function exitDemo() {
            stopDemoAndReset();
            game.load(savedFenBeforeDemo);
            
            document.getElementById('feedback').innerText = "시범 종료! 여기서부터 다시 고민해보세요.";
            document.getElementById('feedback').style.color = "blue";
            
            renderBoard();
            updateStatus();
